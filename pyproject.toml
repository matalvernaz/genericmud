[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "genericmud/__init__.py"

[project]
name = "genericmud"
dynamic = ["version"]
description = "Accessible, cross-platform, self-voicing MUD client"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Matt Alvernaz" }]

# Lua powers the scripting layer (native + VIPMud + MUSHclient soundpacks), so it's a core
# runtime dependency. `regex` gives trigger matching a per-match timeout so a pack's
# catastrophic pattern can't hang the engine (ReDoS). Transport/protocol are otherwise stdlib.
# Native voice and the webview shell stay optional extras.
dependencies = [
  "lupa>=2.0",
  "regex>=2024.0",
]

# A source/pip install gets a `genericmud` command on every platform (Windows/macOS/Linux).
[project.scripts]
genericmud = "genericmud.__main__:main"

[project.optional-dependencies]
# localhost engine<->renderer bridge + webview shell
gui = [
  "wxPython>=4.2",       # native UI (default)
  "websockets>=12",      # web UI bridge (--web)
  "pywebview>=5",        # web UI shell (--web)
]
# self-voicing backends; platform-specific wheels resolve per-OS
voice = [
  # prism speaks through the running screen reader on all three platforms (NVDA/JAWS on
  # Windows, VoiceOver on macOS, Orca on Linux) and falls back to the system TTS itself.
  # Wheels cover win_amd64/arm64, macOS 11+, manylinux_2_34 and musllinux_1_2.
  "prismatoid>=0.17.3",
  "pywin32>=306; platform_system == 'Windows'",  # SAPI5 fallback voice
]
# native soundpack audio playback (the SoundBus pygame backend; --web doesn't need it)
audio = [
  "pygame>=2.5",
]
# standalone app packaging: .exe (Windows), .app (macOS), onedir tarball (Linux)
package = [
  "pyinstaller>=6",
]

# The test/lint toolchain is a dependency group, not an extra: `uv sync` installs it by
# default for contributors, and it never ships as part of a `pip install genericmud[...]`.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

# wxPython publishes no Linux wheel to PyPI, so a plain resolve there falls to a 20-40 minute
# (often failing) source build. Point Linux at the wxPython project's own prebuilt GTK3 index
# instead -- a flat find-links-style listing, hence `format = "flat"`. `explicit = true` keeps
# every other package on PyPI, and pinning the ubuntu-22.04 tree is why CI runs on 22.04.
[[tool.uv.index]]
name = "wxpython-linux-gtk3"
url = "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04/"
format = "flat"
explicit = true

[tool.uv.sources]
wxpython = [{ index = "wxpython-linux-gtk3", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
