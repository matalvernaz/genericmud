name: build-linux

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

# A newer push to the same ref cancels an in-progress build instead of piling up runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Pinned to 22.04 to match the prebuilt wxPython wheel index configured in pyproject.toml
    # ([[tool.uv.index]] wxpython-linux-gtk3); those wheels link against 22.04's GTK stack.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # uv provisions the interpreter itself (.python-version pins 3.12), so there's no
      # setup-python step; the cache keys off uv.lock, which pins every resolved version.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # wxPython and pygame need GTK/audio/X libraries present to import (PyInstaller imports
      # them at build time) and to run. speech-dispatcher is the self-voice engine (spd-say).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libgtk-3-dev libnotify4 libsdl2-2.0-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            speech-dispatcher libspeechd2

      # wxPython has no PyPI Linux wheel; pyproject points Linux at the project's prebuilt
      # ubuntu-22.04 GTK3 index, so the wheel comes straight out of uv.lock -- no find-links
      # step here, and no 20-40 minute source build.
      - name: Install
        run: uv sync --all-extras --locked

      - name: Test Python
        run: xvfb-run -a uv run pytest -q
      - name: Test web input
        run: |
          node --test tests/test_frontend_input.mjs tests/test_frontend_ws.mjs
          node --check frontend/src/app.js

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run python tools/extract_changelog.py CHANGELOG.md "${{ github.ref_name }}" release_notes.md
          cat release_notes.md

      # Produces dist/genericMud/ (portable onedir). --windowed = no console; Orca reads the
      # GTK controls and self-voice speaks through speech-dispatcher.
      - name: Build
        run: xvfb-run -a uv run python tools/build_app.py

      - name: Package
        run: |
          tar -C dist -czf dist/genericMud-linux.tar.gz genericMud
          ls -la dist
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: genericMud-linux
          path: dist/genericMud-linux.tar.gz
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/genericMud-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "genericMud $TAG" \
            --prerelease \
            --notes-file release_notes.md \
          || gh release upload "$TAG" dist/genericMud-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
