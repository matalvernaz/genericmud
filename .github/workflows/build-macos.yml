name: build-macos

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

# A newer push to the same ref cancels an in-progress build instead of piling up runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # uv provisions the interpreter itself (.python-version pins 3.12), so there's no
      # setup-python step; the cache keys off uv.lock, which pins every resolved version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: uv sync --all-extras --locked
      # BASS, the audio library the app plays through, pinned by checksum in the script.
      # The tests below run against it too.
      - name: Fetch BASS
        run: uv run python tools/fetch_bass.py build/bass
      - name: Test Python
        env:
          GENERICMUD_BASS_DIR: build/bass
        run: uv run pytest -q
      - name: Test web input
        run: |
          node --test tests/test_frontend_input.mjs tests/test_frontend_ws.mjs
          node --check frontend/src/app.js

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run python tools/extract_changelog.py CHANGELOG.md "${{ github.ref_name }}" release_notes.md
          cat release_notes.md

      # Produces dist/genericMud.app (a real bundle VoiceOver drives). --windowed = no
      # console. Self-voice uses the built-in `say`; screen-reader review uses VoiceOver.
      - name: Build .app
        run: uv run python tools/build_app.py
      # The licences of Python and the libraries the app runs on, which they ask to have
      # passed on with it (tools/third_party_notices.py, written by the build).
      - name: Check the licence notices went in
        shell: bash
        run: |
          notices=$(find dist/genericMud.app -name THIRD-PARTY-NOTICES.txt | head -1)
          test -n "$notices"
          grep -q "^wxPython " "$notices"
          grep -q "^dulwich " "$notices"
          grep -q "^prismatoid " "$notices"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$notices"  # pygame's LGPL, in full

      # Ship the .app inside a zip so GitHub keeps the bundle's exec bits and structure.
      # ditto is the macOS-native archiver that preserves resource forks/symlinks.
      - name: Package
        run: |
          ditto -c -k --keepParent "dist/genericMud.app" "dist/genericMud-macos.zip"
          ls -la dist
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: genericMud-macos
          path: dist/genericMud-macos.zip
          retention-days: 14

      # Publish idempotently: whichever platform job reaches the tag first creates the
      # release, the rest attach their asset. Mirrors build-windows.yml's fallback.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/genericMud-macos.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "genericMud $TAG" \
            --prerelease \
            --notes-file release_notes.md \
          || gh release upload "$TAG" dist/genericMud-macos.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
